# E2E Test Environment for SemStreams Tiered Testing
#
# ⚠️  THIS FILE IS FOR TIERED E2E TESTING ONLY - DO NOT USE DIRECTLY ⚠️
#
# This compose file is designed to work with task commands:
#   - task e2e:structural   - Rules + graph traversal (no ML)
#   - task e2e:statistical  - BM25 + community detection (no ML)
#   - task e2e:semantic     - Neural embeddings + LLM (requires ML services)
#   - task e2e:clean        - Clean up test environment
#
# Profiles:
#   - structural: NATS + semstreams (rules-only, no ML dependencies)
#   - statistical: NATS + semstreams (BM25 fallback, no ML dependencies)
#   - semantic: NATS + semembed + seminstruct-fast/-mid-answer/-mid-summary + semstreams-ml (full ML)
#
# Usage:
#   docker compose -f docker/compose/tiered.yml --profile structural up -d
#   docker compose -f docker/compose/tiered.yml --profile statistical up -d
#   docker compose -f docker/compose/tiered.yml --profile semantic up -d
#
# NOTE: statistical and semantic profiles are mutually exclusive - don't use both
#       as they share the same NATS KV buckets and will overwrite each other's data
#
# Running this directly will start services but NOT run tests.
# The E2E tests are executed from the host via cmd/e2e/e2e binary.
#
# Following Observer Pattern: E2E tests are external observers of the running system
services:
  # SemEmbed - Lightweight embedding service using fastembed-rs
  # For semantic search testing with OpenAI-compatible API
  # PROFILE: semantic - Only started when --profile semantic is specified
  semembed:
    image: ghcr.io/c360studio/semembed:latest
    container_name: semstreams-tiered-semembed
    profiles:
      - semantic
    ports:
      - "38081:8081" # OpenAI-compatible /v1/embeddings endpoint (3xxxx range)
    environment:
      # SEMEMBED_MODEL omitted: the semembed image bakes in
      # Snowflake/snowflake-arctic-embed-s (384-dim) as the default
      # (matches ADR-043 § "Neural embedding service"). Overriding to a
      # different model forces a runtime HuggingFace download that fails
      # on rate-limited networks; the image default avoids the download
      # entirely.
      - SEMEMBED_PORT=8081
      - RUST_LOG=info
    volumes:
      - semembed-tiered-cache:/home/semembed/.cache/fastembed
    networks:
      - semstreams-tiered-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Generous start_period accommodates rare cases where the image
      # default cache is cold (e.g. semembed image rebuilt without
      # baked-in weights) and a model download is needed.
      start_period: 120s

  # SemInstruct (fast tier) - qwen3-0.6b for classification only.
  # Small input/output, latency-sensitive. CPU-capped to prevent llama.cpp's
  # OpenMP from grabbing all host cores under contention with the two
  # 1.7b mid-tier containers (semspec iso-test 2026-05-05).
  seminstruct-fast:
    image: ghcr.io/c360studio/seminstruct:qwen3-0.6b
    container_name: semstreams-tiered-seminstruct-fast
    profiles:
      - semantic
    ports:
      - "38084:8083" # OpenAI-compatible /v1/chat/completions (3xxxx range)
    environment:
      - MODEL_ALIAS=qwen3-0.6b
      - MODEL_REASONING=off
      - MODEL_CONTEXT=16384
      - MODEL_THREADS=1
      - MODEL_PARALLEL=2
    networks:
      - semstreams-tiered-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # SemInstruct (answer tier) - qwen3-1.7b dedicated to answer_synthesis.
  # Bounded sub-timeout 15s (beta.38). Iso-tested 2026-05-05 in semspec:
  # 1.5-2.2s warm per call, 6.1-8.4s at 5-concurrent — within the 30s
  # graph-gateway QueryTimeout. Splitting answer + summary into separate
  # containers eliminates head-of-line blocking that was forcing forklift
  # queries past the gateway timeout (2026-05-07 globalSearch debug).
  seminstruct-mid-answer:
    image: ghcr.io/c360studio/seminstruct:qwen3-1.7b
    container_name: semstreams-tiered-seminstruct-mid-answer
    profiles:
      - semantic
    ports:
      - "38085:8083" # OpenAI-compatible /v1/chat/completions (3xxxx range)
    environment:
      - MODEL_ALIAS=qwen3-1.7b
      - MODEL_REASONING=off
      - MODEL_CONTEXT=16384
      - MODEL_THREADS=2
      - MODEL_PARALLEL=2
    networks:
      - semstreams-tiered-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G

  # SemInstruct (summary tier) - qwen3-1.7b dedicated to community_summary +
  # anomaly_review. Background batch work that should
  # NOT contend with synthesis on the search hot path. 1.7b is a quality
  # compromise vs the 8b GraphRAG canonical — for the known-answer e2e
  # surface (literal substring match) it suffices; for prod use cases
  # demanding richer narratives, swap this image for :qwen3-8b.
  seminstruct-mid-summary:
    image: ghcr.io/c360studio/seminstruct:qwen3-1.7b
    container_name: semstreams-tiered-seminstruct-mid-summary
    profiles:
      - semantic
    ports:
      - "38086:8083" # OpenAI-compatible /v1/chat/completions (3xxxx range)
    environment:
      - MODEL_ALIAS=qwen3-1.7b
      - MODEL_REASONING=off
      - MODEL_CONTEXT=16384
      - MODEL_THREADS=2
      - MODEL_PARALLEL=2
    networks:
      - semstreams-tiered-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6G

  # NATS Server with JetStream
  nats:
    image: nats:2.14-alpine
    container_name: semstreams-tiered-nats
    ports:
      - "34222:4222" # Client connections (3xxxx range to avoid collisions)
      - "38222:8222" # HTTP monitoring
    command:
      ["-js", "-sd", "/data", "-m", "8222", "--name", "semstreams-tiered-nats"]
    volumes:
      - nats-semstreams-tiered-data:/data
    networks:
      - semstreams-tiered-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # SemStreams Application (statistical tier config)
  # Statistical variant - runs without ML services (uses BM25 fallback for search)
  # PROFILE: statistical - Only started when --profile statistical is specified
  semstreams:
    # Per-target image tag — see docker/compose/e2e.yml for rationale.
    image: c360studio/semstreams:e2e-test
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: e2e
    container_name: semstreams-tiered-app
    profiles:
      - statistical
    command: ["--config", "/app/configs/statistical.json"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - SEMSTREAMS_NATS_URLS=nats://nats:4222
      - SEMSTREAMS_LOG_LEVEL=debug
      - SEMSTREAMS_DEBUG=${SEMSTREAMS_DEBUG:-false}
      - SEMSTREAMS_DEBUG_PORT=6060
      # Embedding disabled by default - BM25 fallback will be used
      - EMBEDDING_PROVIDER=none
    volumes:
      - ../../configs:/app/configs:ro
      - ../../testdata:/data/testdata:ro
    ports:
      - "38080:8080" # HTTP API (health, components)
      - "38082:8084" # GraphQL gateway (host:38082 -> container:8084)
      - "39090:9090" # Prometheus metrics
      - "36060:6060" # pprof (when SEMSTREAMS_DEBUG=true)
      - "34550:14550/udp" # UDP input
      - "38083:8082" # WebSocket output (host:38083 -> container:8082)
    networks:
      - semstreams-tiered-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/readyz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # SemStreams Application (structural tier config)
  # Structural variant - uses e2e-semstreams binary with reactive workflow engine
  # PROFILE: structural - Only started when --profile structural is specified
  semstreams-structural:
    # Per-target image tag — see docker/compose/e2e.yml for rationale.
    image: c360studio/semstreams:e2e-test
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: e2e
    container_name: semstreams-tiered-app-structural
    profiles:
      - structural
    command: ["--config", "/app/configs/e2e-structural.json"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      - SEMSTREAMS_NATS_URLS=nats://nats:4222
      - SEMSTREAMS_LOG_LEVEL=debug
      - SEMSTREAMS_DEBUG=${SEMSTREAMS_DEBUG:-false}
      - SEMSTREAMS_DEBUG_PORT=6060
      - EMBEDDING_PROVIDER=none
    volumes:
      - ../../configs:/app/configs:ro
      - ../../testdata:/data/testdata:ro
    ports:
      - "38080:8080" # HTTP API (health, components)
      - "38082:8082" # GraphQL gateway
      - "39090:9090" # Prometheus metrics
      - "36060:6060" # pprof (when SEMSTREAMS_DEBUG=true)
      - "34550:14550/udp" # UDP input
    networks:
      - semstreams-tiered-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/readyz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # SemStreams Application with ML services enabled
  # PROFILE: semantic - Only started when --profile semantic is specified
  semstreams-ml:
    # Per-target image tag — see docker/compose/e2e.yml for rationale.
    # semantic.json includes the bundled example/domain processors used by the
    # tiered fixture corpus, so this profile must run the e2e binary just like
    # the structural profile. The production binary intentionally does not
    # register those example components.
    image: c360studio/semstreams:e2e-test
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: e2e
    container_name: semstreams-tiered-app-ml
    profiles:
      - semantic
    entrypoint: ["sh", "-c"]
    command: ["sleep 30 && /app/semstreams --config /app/configs/semantic.json"]
    depends_on:
      nats:
        condition: service_healthy
      semembed:
        condition: service_healthy
      seminstruct-fast:
        condition: service_healthy
      seminstruct-mid-answer:
        condition: service_healthy
      seminstruct-mid-summary:
        condition: service_healthy
    environment:
      - SEMSTREAMS_NATS_URLS=nats://nats:4222
      - SEMSTREAMS_LOG_LEVEL=debug
      - SEMSTREAMS_DEBUG=${SEMSTREAMS_DEBUG:-false}
      - SEMSTREAMS_DEBUG_PORT=6060
    volumes:
      - ../../configs:/app/configs:ro
      - ../../testdata:/data/testdata:ro
    ports:
      - "38180:8080" # HTTP API (different port to avoid conflict with core)
      - "38182:8084" # GraphQL gateway (host:38182 -> container:8084)
      - "39190:9090" # Prometheus metrics
      - "36160:6060" # pprof (when SEMSTREAMS_DEBUG=true)
      - "34650:14550/udp" # UDP input
      - "38183:8082" # WebSocket output
    networks:
      - semstreams-tiered-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/readyz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  semstreams-tiered-net:
    driver: bridge

volumes:
  nats-semstreams-tiered-data:
    driver: local
  semembed-tiered-cache:
    driver: local
