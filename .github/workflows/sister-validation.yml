name: Sister Validation

# Manually runs two downstream holdout projects against THIS checkout of
# semstreams rather than a published tag. The `go mod edit -replace` step makes
# the selected downstream suite useful diagnostic evidence for unreleased
# framework changes; it is optional and non-exhaustive, not a release oracle.
#
# Historical why: downstream suites exposed valuable framework findings after
# tags. Current policy keeps them as holdout migration feedback after a stable
# tag, with this dispatch-only workflow available for targeted diagnosis. They
# do not force sister lockstep.
#
# Deliberately NO path filters. The blocking bug that audit found was a change in
# processor/rule/ that breaks ENTITY_STATES for every consumer — any plausible
# path filter would have skipped it.

# DISABLED pre-v1 (owner, 2026-07-23) — no automatic triggers. The sisters
# are downstream holdout adopters, not per-commit or tag-time lockstep gates.
# Framework ingest→graph→query remains gated by the repository's own E2E ladder
# and pre-tag proof. Any future automatic trigger is a separate owner decision;
# this workflow currently runs only through workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      semsource_ref:
        description: "semsource branch/tag"
        required: false
        default: "main"
      semboids_ref:
        description: "semboids branch/tag"
        required: false
        default: "main"

env:
  GO_VERSION: "1.26"

concurrency:
  group: sister-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual semsource lane: highest-ROI document/embedding/body dogfood.
  # semsource exercises the document/embedding/body path — the surface that
  # produced the last three bug waves.
  semsource:
    name: semsource e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout semstreams (this PR)
        uses: actions/checkout@v5
        with:
          path: semstreams

      - name: Checkout semsource
        uses: actions/checkout@v5
        with:
          repository: C360Studio/semsource
          path: semsource
          ref: ${{ inputs.semsource_ref || 'main' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            semstreams/go.sum
            semsource/go.sum

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Point semsource at this semstreams
        working-directory: semsource
        run: |
          go mod edit -replace github.com/c360studio/semstreams=../semstreams
          go mod tidy

      # A compile break here is a real finding: the sister no longer builds
      # against this framework change. Surface it before spending Docker time.
      - name: Build semsource against this semstreams
        working-directory: semsource
        run: go build ./...

      - name: Pull NATS image
        run: docker pull nats:2-alpine

      - name: Run semsource e2e
        working-directory: semsource
        run: task test:e2e

  # Manual broader lane: semboids drives the real sim against real graph-ingest
  # at high volume — the load-dial holdout.
  semboids:
    name: semboids integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout semstreams
        uses: actions/checkout@v5
        with:
          path: semstreams

      - name: Checkout semboids
        uses: actions/checkout@v5
        with:
          repository: C360Studio/semboids
          path: semboids
          ref: ${{ inputs.semboids_ref || 'main' }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            semstreams/go.sum
            semboids/go.sum

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Point semboids at this semstreams
        working-directory: semboids
        run: |
          go mod edit -replace github.com/c360studio/semstreams=../semstreams
          go mod tidy

      - name: Build semboids against this semstreams
        working-directory: semboids
        run: go build ./...

      - name: Pull NATS image
        run: docker pull nats:2-alpine

      - name: Run semboids integration
        working-directory: semboids
        run: task test:integration

  # Manual internal core comparison. The per-PR statistical gate lives in
  # e2e-ladder.yml; this dispatch-only workflow is not its owner.
  semstreams-core:
    name: semstreams e2e core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Run e2e core tier
        run: task e2e:core
