name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # gh#221: revive version pinned via go.mod's `tool` directive
      # (Go 1.24+). No install step — `go tool revive` resolves through
      # the module's pinned version. A new revive release can't surprise
      # CI with new ruleset warnings until we deliberately bump the pin
      # in go.mod. Closes Rule 4 of [[feedback_substrate_flake_discipline]].

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt
        run: |
          fmt_output=$(go fmt ./...)
          if [ -n "$fmt_output" ]; then
            echo "The following files need formatting:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Sanity-check revive version matches go.mod pin
        # gh#221 review M4 — catches the case where setup-go's cache
        # serves a stale binary that doesn't match the current go.mod
        # pin. Cheap (one line of grep) and turns silent drift into
        # loud failure.
        run: |
          # Match the `require` line shape `github.com/mgechev/revive vX.Y.Z`.
          # Use `v` after the package name to disambiguate from the `tool`
          # directive line (which lacks the version).
          expected=$(awk '/github.com\/mgechev\/revive v/ {print $2}' go.mod | head -1)
          # `revive --version` output differs by invocation context:
          # direct install emits "version 1.15.0", `go tool revive` on
          # CI's setup-go emits "v1.15.0". Strip the leading `v` from
          # both sides to normalize.
          actual_raw=$(go tool revive --version 2>&1 | head -1 | awk '{print $NF}')
          expected="${expected#v}"
          actual="${actual_raw#v}"
          if [ "$expected" != "$actual" ]; then
            echo "FAIL: revive version mismatch — go.mod pin: $expected, go tool raw: $actual_raw (normalized: $actual)"
            exit 1
          fi
          echo "OK: revive $actual matches go.mod pin"

      - name: Run revive (pinned via go.mod tool directive)
        run: go tool revive -config revive.toml -formatter friendly ./...

      - name: Substrate-flake guard — fixed-port lint regex matrix test
        # gh#220 review C1 — the lint guard's regex matrix must be
        # verified, not implicitly trusted. Runs fixture test that
        # exercises positive matches + suppression marker.
        run: bash scripts/lint-test-ports_fixture_test.sh

      - name: Substrate-flake guard — no fixed-port net.Listen in test files
        # gh#220 Subclass 2 — fixed-port literals in *_test.go collide
        # under parallel test execution. Single source of truth:
        # scripts/lint-test-ports.sh, also invoked by task lint.
        run: bash scripts/lint-test-ports.sh

      - name: natsclient Request+Unmarshal guard (gh#162)
        # AST lint that catches natsclient.Request / RequestWithRetry calls
        # whose response bytes flow into json.Unmarshal without a prior
        # bytes.HasPrefix("error: ") guard or migration to RequestClassified.
        # This class shipped silently 3x before gh#93 (c626854, 895ec44).
        # Self-test in the package proves the filter is live; allowlist in
        # test/natsclient/request_guard_test.go tracks every known-deferred
        # site with a gh# reference.
        run: go test -v ./test/natsclient/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Pull NATS image
        run: docker pull nats:latest

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Run integration tests
        run: go test -tags=integration -v -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X main.version=${{ github.sha }}" \
            -o semstreams-linux-amd64 \
            ./cmd/semstreams

      - name: Test binary execution
        run: |
          ./semstreams-linux-amd64 --version || true
          echo "Build successful"

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Generate schemas and OpenAPI spec
        run: task schema:generate

      - name: Run OpenAPI generator tests
        run: go test -v ./cmd/openapi-generator

      - name: Check for uncommitted schema changes
        run: |
          if ! git diff --exit-code schemas/ specs/openapi.v3.yaml; then
            echo "❌ Schema or OpenAPI files have uncommitted changes!"
            echo ""
            echo "The following files changed after running 'task schema:generate':"
            git diff --name-only schemas/ specs/openapi.v3.yaml
            echo ""
            echo "Please run 'task schema:generate' locally and commit the changes."
            exit 1
          fi
          echo "✅ All schemas and OpenAPI spec are up to date"

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, test, build, schema-validation]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.schema-validation.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"
