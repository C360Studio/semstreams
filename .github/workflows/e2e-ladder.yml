name: E2E Ladder

# Our own e2e ladder — the per-PR end-to-end gate that exercises the
# ingest → entity → graph store → query path THIS repo owns. It replaces the
# disabled automatic sister-validation gate (see sister-validation.yml).
# Downstream projects are non-exhaustive holdout adopters: after a stable tag
# they pin, migrate, and prove their own product parity. They are not lockstep
# pre-merge or pre-tag framework gates, and no compatibility shim is inferred
# from a downstream migration failure.
#
# Tier choice (owner, 2026-07-23): run the `statistical` tier per-PR. It runs
# the tiered scenario at --variant statistical, which subsumes the structural
# stages and drives the full graph path under BM25 + community detection — no
# neural/ML services, so it stays CI-affordable. This is the pre-v1 program's
# Epic D "automate a tier first" (ci.yml itself runs no e2e).
#
# NOT covered here (deliberately, for CI cost):
#   - e2e:core's coverage is subsumed by the statistical run (owner, 2026-07-28):
#     the tiered/statistical variant boots the full stack and validates
#     health/dataflow along the way, so a separate core job would be redundant.
#   - e2e:semantic's full run and its heavy quality variants (:8b, :frontier)
#     stay pre-tag/manual (docs/contributing/02-e2e-tests.md: a relevant e2e
#     tier green before any BREAKING tag). Per PR, job `e2e semantic
#     (path-only)` runs the DEFAULT semantic variant (semembed + seminstruct
#     qwen3-0.6b/1.7b) with E2E_PATH_ONLY=1, which skips the three quality
#     stages the owner ruled out of the per-PR gate (#1117, 2026-09-29/30):
#     validate-llm-enhancement, validate-thematic-answer-eval,
#     validate-globalsearch-known-answer. Its green is evidence the
#     framework-owned semantic path works, never of answer or summary quality.
#     Per-PR, not nightly (owner, 2026-08-27): schedule-triggered runs are
#     reserved for out-of-band security scanning, never functional e2e.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-ladder-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  e2e-slow-consumer:
    name: e2e slow consumer attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: GOBIN=/usr/local/bin go install github.com/go-task/task/v3/cmd/task@v3.53.1

      # gh#1279: the port preflight answers "is this free now", which is a
      # snapshot, not a reservation. In run 34392378822 it printed
      # "[OK] 8/8 distinct published host ports available" and the bind failed
      # 77 seconds later — an image build sits between probe and bind, and 31
      # of the published host ports fall inside the kernel's ephemeral range,
      # so an outbound socket opened during the build can take the port a tier
      # is about to publish. This reserves them against ephemeral allocation
      # first; they stay explicitly bindable.
      - name: Reserve e2e host ports against ephemeral allocation
        run: scripts/e2e-reserve-ports.sh

      - name: Run assembled slow-consumer attribution proof
        run: task e2e:slow-consumer

  e2e-statistical:
    name: e2e statistical
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: GOBIN=/usr/local/bin go install github.com/go-task/task/v3/cmd/task@v3.53.1

      # gh#1279: the port preflight answers "is this free now", which is a
      # snapshot, not a reservation. In run 34392378822 it printed
      # "[OK] 8/8 distinct published host ports available" and the bind failed
      # 77 seconds later — an image build sits between probe and bind, and 31
      # of the published host ports fall inside the kernel's ephemeral range,
      # so an outbound socket opened during the build can take the port a tier
      # is about to publish. This reserves them against ephemeral allocation
      # first; they stay explicitly bindable.
      - name: Reserve e2e host ports against ephemeral allocation
        run: scripts/e2e-reserve-ports.sh

      # gh#1175: the tier's port preflight derives its set from the compose
      # context it is about to boot. Its regression risk is a guard that
      # passes while checking nothing — exactly what the previous one did —
      # so the guard's own fixture test runs here, in the job it protects and
      # which already pays for Docker.
      - name: Port preflight fixture test
        run: bash scripts/e2e-check-ports_fixture_test.sh

      # gh#1279: the reservation's failure mode is quieter than the
      # preflight's — a reservation covering zero ports reports success and
      # nothing downstream goes red, the tier just flakes again weeks later.
      # So it gets the same treatment: its own fixture test, in the job it
      # protects.
      - name: Port reservation fixture test
        run: bash scripts/e2e-reserve-ports_fixture_test.sh

      # gh#1317: exercise bounded failure capture and real Task defer ordering without live infrastructure.
      - name: Bind diagnostics fixture test
        run: python3 scripts/e2e-statistical-up_fixture_test.py

      - name: Run e2e statistical tier
        run: task e2e:statistical

  # gh#1117: the default semantic variant, path-only (see the header). The
  # skipped stages are logged, never recorded as passed: the log carries one
  # "[PATH-ONLY] skipping 3 quality stages: ..." line and a [n/41] stage
  # counter; [n/44] means the flag did not reach the run. No artifact step:
  # the only results file is written on success and carries no skip record,
  # so the log is the evidence.
  # timeout-minutes: 20. Measured full runs on this runner (E2E Ladder run
  # 36654106894, 682/677 s) minus the three quality stages (~488 s) and the
  # test-http-gateway synthesis (~18 s), plus ~60 s of registry pull, predict
  # ~5 min (the first run measured 4m17s, run 36728438332); 20 is ~4x that and exceeds one full-variant run (13.4 min), so a
  # flag that fails to take effect finishes and is diagnosed from [n/44]
  # instead of being killed. The ghcr login is kept: every measured run had it.
  e2e-semantic:
    name: e2e semantic (path-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      E2E_PATH_ONLY: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        run: GOBIN=/usr/local/bin go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # gh#1279: reserve the published host ports against ephemeral allocation
      # (see e2e-statistical for the failure this prevents).
      - name: Reserve e2e host ports against ephemeral allocation
        run: scripts/e2e-reserve-ports.sh

      - name: Run e2e semantic tier (path-only)
        run: task e2e:semantic
