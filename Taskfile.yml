version: "3"

# Load .env automatically so live_llm and other secret-bearing tests can
# read GEMINI_API_KEY / OPENAI_API_KEY / etc. via os.Getenv when invoked
# through `task`. Matches the sibling pattern in ../semspec and
# ../semteams. .env is gitignored; copy .env.example to .env and fill
# in the keys you need.
dotenv: ['.env']

# Namespace every docker-compose stack this repo drives.
#
# Without this, Compose derives the project name from the compose file's PARENT
# DIRECTORY — which is `docker/compose/` here and in the sibling sem* repos, so they
# all resolve to the project name `compose` and Docker treats them as ONE project.
# The consequences are silent and cross-repo: `task e2e:*` teardown (`docker compose
# -f docker/compose/tiered.yml down -v`) removes a sister repo's containers, and a
# sister stack coming up mid-run can churn ours out from under a running scenario —
# observed as an e2e step failing with "not connected to NATS" partway through.
#
# Container names are unaffected (the compose files set container_name explicitly);
# this only prefixes networks and volumes, which nothing references by literal name.
env:
  COMPOSE_PROJECT_NAME: semstreams

includes:
  build:
    taskfile: ./taskfiles/build.yml
    aliases: [b]
  test:
    taskfile: ./taskfiles/test.yml
    aliases: [t]
  lint:
    taskfile: ./taskfiles/lint.yml
    aliases: [l]
  clean:
    taskfile: ./taskfiles/clean.yml
  schema:
    taskfile: ./taskfiles/schema.yml
  services:
    taskfile: ./taskfiles/services.yml
  dev:
    taskfile: ./taskfiles/dev.yml
    aliases: [d]
  openspec:
    taskfile: ./taskfiles/openspec.yml
    aliases: [os]
  api:
    taskfile: ./taskfiles/apicompat.yml

  # E2E test taskfiles
  e2e:
    taskfile: ./taskfiles/e2e/common.yml
  e2e:core:
    taskfile: ./taskfiles/e2e/core.yml
  e2e:slow-consumer:
    taskfile: ./taskfiles/e2e/slow-consumer.yml
  e2e:structural:
    taskfile: ./taskfiles/e2e/structural.yml
  e2e:statistical:
    taskfile: ./taskfiles/e2e/statistical.yml
  e2e:semantic:
    taskfile: ./taskfiles/e2e/semantic.yml
  e2e:agentic:
    taskfile: ./taskfiles/e2e/agentic.yml
  e2e:lessons:
    taskfile: ./taskfiles/e2e/lessons.yml
  e2e:research-graph:
    taskfile: ./taskfiles/e2e/research-graph.yml
  e2e:deep-research:
    taskfile: ./taskfiles/e2e/deep-research.yml
  e2e:crud-tools:
    taskfile: ./taskfiles/e2e/crud-tools.yml
  e2e:ops:
    taskfile: ./taskfiles/e2e/ops.yml
  e2e:lifecycle:
    taskfile: ./taskfiles/e2e/lifecycle.yml
  e2e:throughput:
    taskfile: ./taskfiles/e2e/throughput.yml
  e2e:openai-responses:
    taskfile: ./taskfiles/e2e/openai-responses.yml

  # ADR-043 prompt-injection classifier measurement
  adr043:
    taskfile: ./taskfiles/adr043.yml

tasks:
  # Default task
  default:
    desc: Show available tasks
    cmds:
      - task --list

  predicate:audit:
    desc: Audit structured predicate candidates against the canonical three-part grammar
    cmds:
      - go run ./cmd/predicate-audit .

  entity-id:audit:
    desc: Validate the deterministic local entity-ID source corpus
    cmds:
      - go run ./cmd/entity-id-audit .

  inventory:verify:
    desc: Re-check every line-pinned entry of an inventory file after commits and list the pinned files to re-read
    cmds:
      - scripts/inventory-verify.sh {{.CLI_ARGS}}

  inventory:verify:test:
    desc: Verify the inventory-verify reporter catches the drift shapes it claims to
    cmds:
      - bash scripts/inventory-verify_fixture_test.sh

  spec:properties:
    desc: Verify every `// spec:` property citation still resolves to a real requirement heading
    cmds:
      - scripts/spec-properties.sh {{.CLI_ARGS}}

  spec:properties:test:
    desc: Verify the spec-properties checker catches the citation states it claims to
    cmds:
      - bash scripts/spec-properties_fixture_test.sh

  predicate:test-audit:
    desc: Audit predicate candidates in Go tests and structured testdata with exact negative classifications
    cmds:
      - go run ./cmd/predicate-test-audit .

  # Observability shortcuts
  observe:up:
    desc: Start Prometheus + Grafana for local monitoring
    cmds:
      - task: services:start:observability

  observe:down:
    desc: Stop observability stack
    cmds:
      - task: services:stop

  observe:logs:
    desc: Tail Prometheus and Grafana logs
    cmds:
      - docker compose -f docker/compose/services.yml --profile observability logs -f

  # Composite tasks
  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint:default
      - task: test:default

  check:push:
    desc: "Full pre-push gate, mirrors CI (~11min, needs Docker): cleanup guard, lint, build, vet integration+live_llm, schema drift, contract, race unit + integration. Use /preflight for the judgment layer (diff scope, breaking->e2e)."
    cmds:
      - task: lint:default
      - task: build:default
      - go vet -tags=integration ./...
      - go vet -tags=live_llm ./...
      - task: schema:generate
      - task: schema:check-changes
      - go test ./test/contract/...
      - go test -race ./...
      - task: test:integration

  # E2E composite tasks
  e2e:tiers:
    desc: Run the three adopted inference tier proofs (structural -> statistical -> semantic)
    silent: false
    cmds:
      - 'echo "[TIERS] Selected proof members: structural, statistical, semantic"'
      - task: e2e:structural
      - sleep 3
      - task: e2e:statistical
      - sleep 3
      - task: e2e:semantic

  e2e:tier:
    internal: true
    requires:
      vars: [PROFILE, VARIANT]
    cmds:
      - defer: docker compose -f docker/compose/tiered.yml --profile {{.PROFILE}} down -v --timeout 15
      - docker compose -f docker/compose/tiered.yml --profile {{.PROFILE}} up -d --wait --build
      - cd cmd/e2e && ./e2e --scenario tiered --variant {{.VARIANT}} {{.EXTRA_ARGS}} --output-dir ./test/e2e/results

  e2e:all:
    desc: Alias for five-family core-inference-agentic proof
    cmds:
      - task: e2e:core-inference-agentic

  e2e:core-inference-agentic:
    desc: Required five-family proof (core, structural, statistical, semantic, agentic)
    silent: false
    deps: ["build:e2e"]
    cmds:
      - |
        . scripts/e2e-required-report.sh
        e2e_report_begin core-inference-agentic composite e2e:core-inference-agentic || exit 1
        echo "[E2E] Required members: core, structural, statistical, semantic, agentic"
        echo "[E2E] Excluded: slow-consumer, lessons, research-graph direct/execute, deep-research, CRUD-tools, ops, lifecycle, throughput, heavy/fallback semantic variants, live OpenAI adapter"
        command_exit=0
        finish() {
          trap - EXIT
          cleanup_exit=0
          # Each child owns its Compose cleanup; the parent has no Compose stack.
          e2e_report_finalize "$command_exit" "$cleanup_exit"
          report_exit=$?
          cat "$E2E_REPORT_LOG"
          if [ "$command_exit" -ne 0 ]; then exit "$command_exit"; fi
          if [ "$report_exit" -ne 0 ]; then exit "$report_exit"; fi
        }
        trap finish EXIT
        run_body() {
          for member in core structural statistical semantic agentic; do
            echo "[E2E] Running required child $member"
            child_output="$E2E_REPORT_DIR/e2e-child-$E2E_REPORT_RUN_ID-$member.stdout"
            child_exit=0
            E2E_REPORT_PARENT_ID="$E2E_REPORT_RUN_ID" E2E_REPORT_PARENT_SLOT="$member" \
              E2E_REPORT_DIR="$E2E_REPORT_DIR" task "e2e:$member" > "$child_output" 2>&1 || child_exit=$?
            cat "$child_output"
            child_argv_json=$(jq -nc --arg target "e2e:$member" '["task",$target]') || return 1
            e2e_report_child "$member" "$child_output" "$child_exit" "$child_argv_json" || return 1
            [ "$child_exit" -eq 0 ] || return "$child_exit"
          done
        }
        run_body >> "$E2E_REPORT_LOG" 2>&1 || command_exit=$?
        finish
