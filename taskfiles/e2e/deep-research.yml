version: "3"

# Deep-Research Tier: Rules-driven multi-agent research flow E2E
# Exercises the full chain: user question → general agent → researcher → evidence KV → synthesizer.
# Uses the mock OpenAI server with role-routed responses for deterministic testing.
# Runs on ports 5xxxx so it can run alongside task e2e:agentic.

tasks:
  default:
    desc: "Deep-research tier: rules-driven multi-agent flow (~10s)"
    silent: false
    deps: [":e2e:clean", ":e2e:check-ports", ":build:e2e"]
    cmds:
      - echo "[DEEP-RESEARCH] Starting deep-research tier E2E test..."
      - docker compose -f docker/compose/deep-research.yml up -d --wait --build
      - echo "[OK] Services are healthy (NATS + mock-llm + semstreams)"
      - echo "[DEEP-RESEARCH] Running scenario..."
      - cmd: cd cmd/e2e && ./e2e --scenario deep-research --output-dir ./test/e2e/results --metrics-url http://localhost:59090
        ignore_error: true
      - docker compose -f docker/compose/deep-research.yml down -v --timeout 15

  up:
    desc: Start deep-research tier services without running tests
    silent: false
    cmds:
      - echo "[DEEP-RESEARCH] Starting services..."
      - docker compose -f docker/compose/deep-research.yml up -d --wait --build
      - echo "[OK] Services are healthy"
      - 'echo ""'
      - 'echo "Services:"'
      - 'echo "  NATS:       nats://localhost:54222"'
      - 'echo "  Mock LLM:   http://localhost:58180"'
      - 'echo "  SemStreams: http://localhost:58080"'
      - 'echo "  Metrics:    http://localhost:59090/metrics"'
      - 'echo ""'
      - 'echo "To run tests: task e2e:deep-research:test"'
      - 'echo "To stop:      task e2e:deep-research:down"'

  test:
    desc: Run deep-research scenario against already-running services
    silent: false
    deps: [":build:e2e"]
    cmds:
      - echo "[DEEP-RESEARCH] Running scenario..."
      - cd cmd/e2e && ./e2e --scenario deep-research --output-dir ./test/e2e/results --metrics-url http://localhost:59090

  down:
    desc: Stop deep-research tier services
    silent: false
    cmds:
      - echo "[DEEP-RESEARCH] Stopping services..."
      - docker compose -f docker/compose/deep-research.yml down -v --timeout 15
      - echo "[OK] Services stopped"

  logs:
    desc: Tail logs from deep-research services
    silent: false
    cmds:
      - docker compose -f docker/compose/deep-research.yml logs -f

  clean:
    desc: Clean deep-research tier environment
    silent: false
    cmds:
      - echo "[DEEP-RESEARCH] Cleaning environment..."
      - docker compose -f docker/compose/deep-research.yml down -v --timeout 15 2>/dev/null || true
      - docker volume ls -q --filter name=deep-research | xargs -r docker volume rm 2>/dev/null || true
      - echo "[OK] Deep-research environment cleaned"
