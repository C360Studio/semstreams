version: "3"

tasks:
  # gh#1175. Two defects made this guard worse than useless.
  #
  # 1. It raced the teardown. `check-ports` was a SIBLING of `:e2e:clean` in
  #    every tier's `deps:` list, and Task runs deps in PARALLEL — in run
  #    33277988561 the guard printed "[OK] All ports available" at 22:12:25.7
  #    while `e2e:clean` was still running `docker compose ... down` until
  #    22:12:26.5. It was inspecting an environment mid-destruction.
  #    The fix is the `deps:` below: the guard now depends on the teardown, so
  #    it cannot start until `clean` has returned. Callers list only
  #    `:e2e:check-ports`; they must NOT also list `:e2e:clean`, because Task
  #    3.51 does not dedupe a task requested twice in one run (measured — it
  #    ran `clean` twice, concurrently) and the sibling entry would restore
  #    the race.
  #
  # 2. It guarded 2 of 46 ports — 38080/tcp and 34550/udp, hand-written — then
  #    claimed "All ports available". The run it was supposed to protect died
  #    binding 36060, which no preflight had ever looked at. The set is now
  #    DERIVED from the compose context each caller passes, so it cannot drift
  #    from what `docker compose up` binds, and the [OK] line carries the count
  #    it actually probed.
  check-ports:
    desc: "Verify the host ports an E2E run is about to bind are free (COMPOSE_FILES=... PROFILES=... for a per-run guarantee; bare = advisory union)"
    silent: false
    deps: [":e2e:clean"]
    vars:
      COMPOSE_FILES: '{{.COMPOSE_FILES | default ""}}'
      PROFILES: '{{.PROFILES | default ""}}'
    cmds:
      - |
        profiles="{{.PROFILES}}"
        args=""
        for p in $profiles; do args="$args --profile $p"; done
        scripts/e2e-check-ports.sh $args {{.COMPOSE_FILES}}

  check-ports:test:
    desc: |
      Verify the port preflight itself — that it derives the set from the
      compose context, counts honestly, and refuses to print [OK] over a set
      it could not fully probe. gh#1175: the guard this replaced probed 2 of
      46 ports and then claimed all of them, so the regression risk is a
      guard that passes while checking nothing.
    silent: false
    cmds:
      - bash scripts/e2e-check-ports_fixture_test.sh

  clean:
    desc: Clean E2E test environment
    silent: false
    cmds:
      - echo "[E2E CLEAN] Cleaning SemStreams E2E environment..."
      - docker compose -f docker/compose/e2e.yml down -v --timeout 15 2>/dev/null || true
      - docker compose -f docker/compose/e2e.yml --profile fixtures down -v --timeout 15 2>/dev/null || true
      - docker compose -f docker/compose/e2e-slow-consumer.yml down -v --timeout 15 2>/dev/null || true
      - docker compose -f docker/compose/tiered.yml --profile structural down -v --timeout 15 2>/dev/null || true
      - docker compose -f docker/compose/tiered.yml --profile statistical down -v --timeout 15 2>/dev/null || true
      - docker compose -f docker/compose/tiered.yml --profile semantic down -v --timeout 15 2>/dev/null || true
      - docker compose -f docker/compose/lifecycle.yml down -v --timeout 15 2>/dev/null || true
      - docker volume ls -q --filter name=semstreams | xargs -r docker volume rm 2>/dev/null || true
      - docker volume ls -q --filter name=semembed | xargs -r docker volume rm 2>/dev/null || true
      - docker volume ls -q --filter name=nats-semstreams | xargs -r docker volume rm 2>/dev/null || true
      - echo "[OK] E2E environment cleaned"

  analyze-profiles:
    desc: List available pprof profiles and show analysis commands
    silent: false
    cmds:
      - |
        echo "[PROFILES] Looking for captured profiles..."
        if ls test/e2e/results/profiles/*.pprof 2>/dev/null; then
          echo ""
          echo "To analyze a profile:"
          echo "  go tool pprof <profile.pprof>"
          echo ""
          echo "Common pprof commands:"
          echo "  top10        - Show top 10 consumers"
          echo "  top20 -cum   - Show top 20 by cumulative time"
          echo "  web          - Open interactive graph (requires graphviz)"
          echo "  list <func>  - Show annotated source for function"
          echo ""
          echo "Compare profiles:"
          echo "  go tool pprof -diff_base=before.pprof after.pprof"
        else
          echo "No profiles found in test/e2e/results/profiles/"
          echo ""
          echo "To capture profiles, run e2e tests with profiling enabled:"
          echo "  SEMSTREAMS_DEBUG=true task e2e:core"
        fi

  clean-profiles:
    desc: Remove all captured pprof profiles
    silent: false
    cmds:
      - |
        echo "[CLEAN] Removing captured profiles..."
        rm -rf test/e2e/results/profiles/*.pprof test/e2e/results/profiles/*.out 2>/dev/null || true
        echo "[OK] Profiles cleaned"
