version: "3"

# Semantic Tier: Neural embeddings, LLM summaries, semantic search
# Requires external ML services: SemEmbed, SemInstruct

tasks:
  default:
    desc: "Semantic tier: Neural embeddings + LLM (~90s)"
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/tiered.yml", PROFILES: "semantic" }
      - ":build:e2e"
    cmds:
      - echo "[SEMANTIC] Starting semantic tier E2E test (SemEmbed + SemInstruct)..."
      - defer: docker compose -f docker/compose/tiered.yml --profile semantic down -v --timeout 15
      - docker compose -f docker/compose/tiered.yml --profile semantic up -d --wait --build
      - echo "[OK] ML services are healthy (SemEmbed + SemInstruct)"
      - echo "[SEMANTIC] Running semantic tier scenario..."
      # ML app runs on port 38180 (HTTP), 39190 (metrics), 34650 (UDP) to avoid conflict
      - cd cmd/e2e && ./e2e --scenario tiered --variant semantic --base-url http://localhost:38180 --udp-endpoint localhost:34650 --metrics-url http://localhost:39190 --output-dir ./test/e2e/results

  8b:
    desc: "HEAVY LOCAL: semantic tier with qwen3-8b answer+summary (valid GraphRAG/B0 baseline, NOT CI). ~10min, needs ~20GiB Docker RAM."
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/tiered.yml docker/compose/tiered.8b.yml", PROFILES: "semantic" }
      - ":build:e2e"
    cmds:
      - echo "[SEMANTIC-8B] Standing up the semantic tier on qwen3-8b (answer_synthesis + community_summary)."
      - echo "[SEMANTIC-8B] This is the on-demand HEAVY measurement — two 8B instances load ~5GiB weights each; --wait blocks several minutes. The default 'task e2e:semantic' stays on qwen3-1.7b as the fast CI gate."
      - defer: docker compose -f docker/compose/tiered.yml -f docker/compose/tiered.8b.yml --profile semantic down -v --timeout 15
      # Both overlays; --build rebuilds semstreams from source. The overlay raises
      # the semantic profile's 120s request-handler budget to 300s for 8B inference.
      # --wait-timeout 600 bounds the slow 8B model load instead of hanging forever.
      - docker compose -f docker/compose/tiered.yml -f docker/compose/tiered.8b.yml --profile semantic up -d --wait --wait-timeout 600 --build
      - echo "[OK] 8B ML services healthy (semembed + seminstruct-fast/0.6b + two seminstruct-mid/8b)"
      - echo "[SEMANTIC-8B] Running semantic tier scenario (includes the B0 thematic eval)..."
      # SEMSTREAMS_E2E_GLOBALSEARCH_TIMEOUT raises host-side client patience for the
      # B0 eval + known-answer gate so slow 8B synthesis completes instead of tripping
      # the 60s default. SEMSTREAMS_E2E_LLM_ENHANCEMENT_WAIT lets the summary-wait span
      # slow 8B community summarization so B0 synthesizes over full Tier-2 summaries.
      # Both unset elsewhere = unchanged CI behavior.
      - cd cmd/e2e && SEMSTREAMS_E2E_GLOBALSEARCH_TIMEOUT=300s SEMSTREAMS_E2E_LLM_ENHANCEMENT_WAIT=10m ./e2e --scenario tiered --variant semantic --base-url http://localhost:38180 --udp-endpoint localhost:34650 --metrics-url http://localhost:39190 --output-dir ./test/e2e/results

  frontier:
    desc: "DIAGNOSTIC/CLOUD (not offline, not CI): semantic tier with Gemini 2.5 Flash for answer+summary — measures the synthesis-quality CEILING over the same retrieval/partition. Needs GEMINI_API_KEY (source ../semdev/.env). ~5min."
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/tiered.yml docker/compose/tiered.frontier.yml", PROFILES: "semantic" }
      - ":build:e2e"
    cmds:
      - echo "[SEMANTIC-FRONTIER] Routing answer_synthesis + community_summary to Gemini 2.5 Flash — a CLOUD yardstick, NOT the offline-first product path. Production Tier-2 stays local seminstruct."
      - 'test -n "$GEMINI_API_KEY" || { echo "[ERROR] GEMINI_API_KEY is unset. Source it first, e.g.: set -a && source ../semdev/.env && set +a"; exit 1; }'
      # Base tiered.yml (base first) + the frontier overlay (wins the merge). Local
      # mids stay light/unused (synthesis→Gemini), so the box does not thrash like 8b.
      - defer: docker compose -f docker/compose/tiered.yml -f docker/compose/tiered.frontier.yml --profile semantic down -v --timeout 15
      - docker compose -f docker/compose/tiered.yml -f docker/compose/tiered.frontier.yml --profile semantic up -d --wait --wait-timeout 300 --build
      - echo "[OK] Frontier stack healthy (semembed + seminstruct-fast/0.6b classifier; synthesis+summary → Gemini 2.5 Flash)"
      - echo "[SEMANTIC-FRONTIER] Running semantic tier scenario (includes the B0 thematic eval)..."
      - cd cmd/e2e && SEMSTREAMS_E2E_GLOBALSEARCH_TIMEOUT=180s SEMSTREAMS_E2E_LLM_ENHANCEMENT_WAIT=5m ./e2e --scenario tiered --variant semantic --base-url http://localhost:38180 --udp-endpoint localhost:34650 --metrics-url http://localhost:39190 --output-dir ./test/e2e/results

  debug:
    desc: Start semantic tier for debugging (leaves containers running)
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/tiered.yml", PROFILES: "semantic" }
    cmds:
      - echo "[SEMANTIC DEBUG] Starting semantic tier environment..."
      - docker compose -f docker/compose/tiered.yml --profile semantic up -d --wait --build
      - echo "[OK] ML services are healthy (SemEmbed + SemInstruct)"
      - echo ""
      - echo "[SEMANTIC DEBUG] Environment is running. Use the following commands:"
      - echo "  docker logs -f semstreams-tiered-app-ml       (Follow app logs)"
      - echo "  docker logs -f semstreams-tiered-semembed     (Follow SemEmbed logs)"
      - echo "  docker logs -f semstreams-tiered-seminstruct-fast        (Follow fast tier — 0.6b classification)"
      - echo "  docker logs -f semstreams-tiered-seminstruct-mid-answer  (Follow mid-answer tier — 1.7b answer_synthesis)"
      - echo "  docker logs -f semstreams-tiered-seminstruct-mid-summary (Follow mid-summary tier — 1.7b community_summary)"
      - echo "  docker logs -f semstreams-tiered-nats         (Follow NATS logs)"
      - echo "  curl http://localhost:38180/health            (Test health endpoint)"
      - echo "  curl http://localhost:36160/debug/pprof/      (PProf, if SEMSTREAMS_DEBUG=true)"
      - echo "  task e2e:clean                                (Clean up when done)"

  fallback:
    desc: "Test graceful degradation: semantic config WITHOUT ML services"
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/tiered.yml", PROFILES: "statistical" }
      - ":build:e2e"
    cmds:
      - echo "[SEMANTIC-FALLBACK] Testing semantic config graceful degradation (no ML services)..."
      - echo "[SEMANTIC-FALLBACK] Starting NATS only (no semembed/seminstruct)..."
      # Use statistical profile (just NATS + app) but with semantic config
      - defer: docker compose -f docker/compose/tiered.yml --profile statistical down -v --timeout 15
      - docker compose -f docker/compose/tiered.yml --profile statistical up -d --wait --build
      - echo "[OK] Services started without ML services"
      - echo "[SEMANTIC-FALLBACK] Running fallback scenario..."
      # Run with semantic-fallback variant to trigger fallback validation
      - cd cmd/e2e && ./e2e --scenario tiered --variant semantic-fallback --output-dir ./test/e2e/results

  compare:
    desc: Run statistical vs semantic and generate comparison report
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/tiered.yml", PROFILES: "statistical semantic" }
      - ":build:e2e"
    cmds:
      - echo "[COMPARE] Running statistical variant first..."
      - task: compare:statistical
      - echo "[COMPARE] Running semantic variant second..."
      - sleep 5
      - task: compare:semantic
      - echo "[COMPARE] Generating comparison report..."
      - cd cmd/e2e && ./e2e --analyze-comparison --output-dir ./test/e2e/results
      - echo "[OK] Comparison report generated in ./test/e2e/results/"

  compare:statistical:
    internal: true
    cmds:
      # --build so the comparison exercises current source, not a stale cached image.
      - defer: docker compose -f docker/compose/tiered.yml --profile statistical down -v --timeout 15
      - docker compose -f docker/compose/tiered.yml --profile statistical up -d --wait --build
      - cd cmd/e2e && ./e2e --scenario tiered --variant statistical --output-dir ./test/e2e/results

  compare:semantic:
    internal: true
    cmds:
      - defer: docker compose -f docker/compose/tiered.yml --profile semantic down -v --timeout 15
      - docker compose -f docker/compose/tiered.yml --profile semantic up -d --wait --build
      - cd cmd/e2e && ./e2e --scenario tiered --variant semantic --base-url http://localhost:38180 --udp-endpoint localhost:34650 --metrics-url http://localhost:39190 --output-dir ./test/e2e/results
