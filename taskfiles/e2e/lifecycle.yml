version: "3"

tasks:
  default:
    desc: Run lifecycle E2E tests (ADR-047 Lifecycle harness gateway + rule round-trip)
    silent: false
    deps: [":e2e:clean", ":e2e:check-ports", ":build:e2e"]
    cmds:
      - echo "[E2E LIFECYCLE] Starting SemStreams lifecycle environment..."
      # --build so the tier exercises CURRENT source, not a stale cached image
      # (the agentic tier already does this; lifecycle silently reused a stale
      # build, masking the gh#246 boot fix).
      - docker compose -f docker/compose/lifecycle.yml up -d --wait --build
      - echo "[OK] All services are healthy"
      - echo "[E2E LIFECYCLE] Running lifecycle scenario..."
      # gh#811: capture the scenario's exit code, tear down, then exit with it.
      # ignore_error:true made this task exit 0 on scenario failure, so the tier
      # could not go red — a gate that cannot fail is a slow test, not a gate.
      # `|| rc=$?` not `; rc=$?`: Task aborts the block on a failing command,
      # so `;` skipped the teardown entirely and leaked the stack — verified by
      # counting containers, not by reading the exit code. `||` is a condition
      # context, which is exempt. The subshell keeps `cd` from leaking into the
      # compose path, which resolves from the repo root.
      - cmd: |
          rc=0
          (cd cmd/e2e && ./e2e --scenario lifecycle) || rc=$?
          docker compose -f docker/compose/lifecycle.yml down -v --timeout 15
          exit $rc

  debug:
    desc: Start lifecycle E2E environment for debugging (leaves containers running)
    silent: false
    deps: [":e2e:clean", ":e2e:check-ports"]
    cmds:
      - echo "[E2E LIFECYCLE DEBUG] Starting SemStreams lifecycle environment..."
      - docker compose -f docker/compose/lifecycle.yml up -d --build
      - echo "[E2E LIFECYCLE DEBUG] Waiting for NATS..."
      - |
        for i in {1..30}; do
          if curl -sf http://localhost:38222/healthz > /dev/null 2>&1; then
            echo "[OK] NATS is ready"
            break
          fi
          echo "Waiting for NATS... ($i/30)"
          sleep 2
        done
      - echo "[E2E LIFECYCLE DEBUG] Waiting 5 seconds for SemStreams to start..."
      - sleep 5
      - docker logs semstreams-lifecycle-app
      - echo ""
      - echo "[E2E LIFECYCLE DEBUG] Environment is running. Use:"
      - echo "  curl http://localhost:38080/lifecycle-gateway/workflows"
      - echo "  docker logs -f semstreams-lifecycle-app"
      - echo "  task e2e:clean   # cleanup"
