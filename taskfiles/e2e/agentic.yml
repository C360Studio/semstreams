version: "3"

# Agentic Tier: Agent loop, model, and tools E2E testing
# Uses mock OpenAI server by default for deterministic CI testing
# Override with AGENTIC_LLM_URL for local testing with real LLMs (e.g., Ollama)
#
# configs/agentic.json sets agentic-loop.timeout to 180s, which JSON cannot
# explain in place. The reason is this tier's own process-replacement stage: a
# loop's TimeoutAt is written at birth and is NOT refreshed by a rebuild
# (#1330), so a loop held across a kill + `up --wait` + health settle - 10-25s
# on a warm host, more on a cold one - dies of its own deadline the moment the
# replacement touches it. 30s raced that window. 180s is the replacement budget
# with room, not a claim about how long an agentic loop should take; the stage
# asserts the premise and fails loudly if the deadline passed during the gap.

tasks:
  default:
    desc: "Agentic tier: Agent loop + tools + process replacement + milestone settlement (~5m35s measured 2026-09-24)"
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/agentic.yml" }
      - ":build:e2e"
    cmds:
      - |
        . scripts/e2e-required-report.sh
        e2e_report_begin agentic agentic e2e:agentic || exit 1
        e2e_report_add_file compose docker/compose/agentic.yml || exit 1
        e2e_report_add_file config configs/agentic.json || exit 1
        for fixture in testdata/semantic/*.jsonl; do
          e2e_report_add_file fixture "$fixture" || exit 1
        done
        command_exit=0
        finish() {
          trap - EXIT
          cleanup_exit=0
          docker compose -f docker/compose/agentic.yml down -v --timeout 15 >> "$E2E_REPORT_LOG" 2>&1 || cleanup_exit=$?
          e2e_report_finalize "$command_exit" "$cleanup_exit"
          report_exit=$?
          cat "$E2E_REPORT_LOG"
          if [ "$command_exit" -ne 0 ] || [ "$cleanup_exit" -ne 0 ] || [ "$report_exit" -ne 0 ]; then exit 1; fi
        }
        trap finish EXIT
        run_body() {
          echo "[AGENTIC] Starting agentic tier E2E test..."
          docker compose -f docker/compose/agentic.yml up -d --wait --build || return $?
          echo "[OK] Services are healthy (NATS + mock-llm + semstreams)"
          e2e_report_capture_app production semstreams-agentic-app || return $?
          child_input=$(e2e_report_child_input agentic agentic) || return $?
          child_output="$E2E_REPORT_DIR/e2e-child-$E2E_REPORT_RUN_ID-agentic.stdout"
          child_exit=0
          "$E2E_REPORT_BIN" --scenario agentic --output-dir "$E2E_REPORT_DIR" \
            --metrics-url http://localhost:39090 --evidence-input "$child_input" > "$child_output" 2>&1 || child_exit=$?
          cat "$child_output"
          e2e_report_child agentic "$child_output" "$child_exit" || return 1
          [ "$child_exit" -eq 0 ]
        }
        run_body >> "$E2E_REPORT_LOG" 2>&1 || command_exit=$?

  up:
    desc: Start agentic tier services without running tests
    silent: false
    cmds:
      - echo "[AGENTIC] Starting agentic tier services..."
      - docker compose -f docker/compose/agentic.yml up -d --wait --build
      - echo "[OK] Services are healthy"
      - 'echo ""'
      - 'echo "Services:"'
      - 'echo "  NATS:       nats://localhost:34222"'
      - 'echo "  Mock LLM:   http://localhost:38180"'
      - 'echo "  SemStreams: http://localhost:38080"'
      - 'echo "  Metrics:    http://localhost:39090/metrics"'
      - 'echo "  PProf:      http://localhost:36060/debug/pprof/ (if SEMSTREAMS_DEBUG=true)"'
      - 'echo ""'
      - 'echo "To run tests: task e2e:agentic:test"'
      - 'echo "To stop:      task e2e:agentic:down"'

  test:
    desc: Run agentic tests against already-running services
    silent: false
    deps: [":build:e2e"]
    cmds:
      - echo "[AGENTIC] Running agentic scenario..."
      - cd cmd/e2e && ./e2e --scenario agentic --output-dir ./test/e2e/results --metrics-url http://localhost:39090

  down:
    desc: Stop agentic tier services
    silent: false
    cmds:
      - echo "[AGENTIC] Stopping agentic tier services..."
      - docker compose -f docker/compose/agentic.yml down -v --timeout 15
      - echo "[OK] Services stopped"

  logs:
    desc: Tail logs from agentic services
    silent: false
    cmds:
      - docker compose -f docker/compose/agentic.yml logs -f

  clean:
    desc: Clean agentic tier environment
    silent: false
    cmds:
      - echo "[AGENTIC] Cleaning agentic tier environment..."
      - docker compose -f docker/compose/agentic.yml down -v --timeout 15 2>/dev/null || true
      - docker volume ls -q --filter name=agentic | xargs -r docker volume rm 2>/dev/null || true
      - echo "[OK] Agentic environment cleaned"
