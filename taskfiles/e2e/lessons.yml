version: "3"

tasks:
  default:
    desc: Run direct-product lesson birth/lifecycle/reader-matcher E2E gate
    silent: false
    deps: [":e2e:clean", ":e2e:check-ports", ":build:e2e"]
    cmds:
      - echo "[E2E LESSONS] Starting production-target core environment..."
      - defer: docker compose -f docker/compose/e2e.yml down -v --timeout 15
      - docker compose -f docker/compose/e2e.yml up -d --wait --build
      - echo "[OK] Core services are healthy"
      - echo "[E2E LESSONS] Running direct-product lesson scenario..."
      - cd cmd/e2e && ./e2e --scenario lessons
