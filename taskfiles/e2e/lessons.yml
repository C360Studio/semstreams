version: "3"

tasks:
  default:
    desc: Run direct-product lesson birth/lifecycle/reader-matcher E2E gate
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/e2e.yml", PROFILES: "fixtures" }
      - ":build:e2e"
    cmds:
      # ADR-103: the lesson scenario births its evidence fixture as
      # test.fixture.v1, which only cmd/e2e-semstreams registers, so this tier
      # boots the e2e-target twin (`fixtures` profile), not the production app.
      - echo "[E2E LESSONS] Starting e2e-target core environment (fixtures profile)..."
      - defer: docker compose -f docker/compose/e2e.yml --profile fixtures down -v --timeout 15
      - docker compose -f docker/compose/e2e.yml --profile fixtures up -d --wait --build nats semstreams-fixtures
      - echo "[OK] Core services are healthy"
      - echo "[E2E LESSONS] Running direct-product lesson scenario..."
      - cd cmd/e2e && ./e2e --scenario lessons
