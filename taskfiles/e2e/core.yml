version: "3"

tasks:
  default:
    desc: Run core E2E tests (health + dataflow on the production binary; graph round-trip on the e2e-target binary)
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/e2e.yml", PROFILES: "fixtures" }
      - ":build:e2e"
    cmds:
      - echo "[E2E] Starting SemStreams E2E environment..."
      # --build so the tier exercises CURRENT source, not a stale cached image (gh#246 follow-up).
      - defer: docker compose -f docker/compose/e2e.yml down -v --timeout 15
      - docker compose -f docker/compose/e2e.yml up -d --wait --build
      - echo "[OK] All services are healthy"
      - |
        fail() {
          echo "[FAIL] $1"
          docker logs semstreams-e2e-app 2>&1 || true
          exit 1
        }

        ready=$(curl --max-time 5 -fsS http://localhost:38080/readyz) || fail "readiness endpoint unavailable"
        [ "$ready" = "READY" ] || fail "readiness body was not exact READY"

        health=$(curl --max-time 5 -fsS http://localhost:38080/components/health) || fail "component health unavailable"
        total=$(printf '%s' "$health" | jq -er '.total | select(type == "number" and . > 0)') || fail "component health total is missing or zero"
        healthy=$(printf '%s' "$health" | jq -er '[.components[] | select(.healthy == true)] | length') || fail "component health entries are malformed"
        overall=$(printf '%s' "$health" | jq -er '.overall.status') || fail "overall component health is missing"
        [ "$overall" = "healthy" ] || fail "selected core fixture is not fully healthy"
        [ "$healthy" -eq "$total" ] || fail "selected core fixture reports unhealthy components"

        startup_metrics=$(curl --max-time 5 -fsS http://localhost:39090/metrics) \
          || fail "startup metrics unavailable"
        startup_series=$(printf '%s\n' "$startup_metrics" | grep '^semstreams_startup_units{') \
          || fail "startup metric family missing"
        series_count=$(printf '%s\n' "$startup_series" | wc -l | tr -d ' ')
        [ "$series_count" -eq 9 ] || fail "startup metric family did not contain exactly nine fixed series"
        startup_value() {
          printf '%s\n' "$startup_series" \
            | awk -v owner="$1" -v stage="$2" \
              '$0 ~ "owner=\\\"" owner "\\\"" && $0 ~ "stage=\\\"" stage "\\\"" {print $2}'
        }
        services_admitted=$(startup_value services admitted)
        services_invoked=$(startup_value services starts_invoked)
        services_completed=$(startup_value services starts_completed)
        services_failed=$(startup_value services starts_failed)
        components_admitted=$(startup_value components admitted)
        components_participants=$(startup_value components lifecycle_participants)
        components_invoked=$(startup_value components starts_invoked)
        components_completed=$(startup_value components starts_completed)
        components_failed=$(startup_value components starts_failed)
        [ "$services_admitted" -gt 0 ] || fail "no admitted services in startup metrics"
        [ "$services_invoked" = "$services_admitted" ] || fail "service Starts invoked did not match admission"
        [ "$services_completed" = "$services_admitted" ] || fail "service Starts completed did not match admission"
        [ "$services_failed" = "0" ] || fail "normal boot reported failed service Starts"
        [ "$components_admitted" -gt 0 ] || fail "no admitted components in startup metrics"
        [ "$components_participants" -gt 0 ] || fail "no lifecycle components in startup metrics"
        [ "$components_invoked" = "$components_participants" ] || fail "component Starts invoked did not match participants"
        [ "$components_completed" = "$components_participants" ] || fail "component Starts completed did not match participants"
        [ "$components_failed" = "0" ] || fail "normal boot reported failed component Starts"

        attempt=0
        matched=false
        while [ "$attempt" -lt 20 ]; do
          if docker logs semstreams-e2e-app 2>&1 | jq -Re \
            'fromjson? | select(.msg == "System heartbeat" and .components_total == 0 and .components_healthy == 0)' >/dev/null; then
            fail "heartbeat reported 0/0 while runtime component health was non-empty"
          fi
          heartbeat=$(docker logs semstreams-e2e-app 2>&1 | jq -Rc 'fromjson? | select(.msg == "System heartbeat")' | tail -n 1)
          if [ -n "$heartbeat" ] && printf '%s' "$heartbeat" | jq -e --argjson total "$total" --argjson healthy "$healthy" \
            '.components_total == $total and .components_healthy == $healthy' >/dev/null; then
            matched=true
            break
          fi
          attempt=$((attempt + 1))
          sleep 0.5
        done
        [ "$matched" = "true" ] || fail "heartbeat totals did not match runtime component health within 10s"
        echo "[OK] Readiness and heartbeat report $healthy/$total healthy components"
      - echo "[E2E] Running core tests on the production binary (health + dataflow)..."
      - cd cmd/e2e && ./e2e --scenario all
      - |
        fail() {
          echo "[FAIL] $1"
          docker logs semstreams-e2e-app 2>&1 || true
          exit 1
        }

        echo "[E2E] Sending SIGTERM to the SemStreams application..."
        docker compose -f docker/compose/e2e.yml stop --timeout 35 semstreams || fail "application stop command failed"

        exit_code=$(docker inspect semstreams-e2e-app | jq -er '.[0].State.ExitCode') || fail "application exit code unavailable"
        [ "$exit_code" -eq 0 ] || fail "application exited with code $exit_code"

        docker logs semstreams-e2e-app 2>&1 | jq -Re 'fromjson? | select(.msg == "SemStreams shutdown complete")' >/dev/null \
          || fail "shutdown-complete record missing"

        if curl --connect-timeout 1 --max-time 2 -sS http://localhost:38080/readyz >/dev/null 2>&1; then
          api_status=0
        else
          api_status=$?
        fi
        [ "$api_status" -eq 7 ] || fail "API listener probe exited $api_status after application exit, want connection failure 7"

        if curl --connect-timeout 1 --max-time 2 -sS http://localhost:39090/metrics >/dev/null 2>&1; then
          metrics_status=0
        else
          metrics_status=$?
        fi
        [ "$metrics_status" -eq 7 ] || fail "metrics listener probe exited $metrics_status after application exit, want connection failure 7"

        curl --max-time 5 -fsS http://localhost:38222/healthz >/dev/null \
          || fail "external NATS did not remain healthy after application exit"
        echo "[OK] SIGTERM exited 0, released listeners, completed shutdown, and left NATS healthy"
      - |
        early_suffix=$$
        early_network="semstreams-early-sigterm-net-$early_suffix"
        early_blackhole="semstreams-early-sigterm-blackhole-$early_suffix"
        early_app="semstreams-early-sigterm-app-$early_suffix"

        cleanup_early_boot() {
          docker rm -f "$early_app" "$early_blackhole" >/dev/null 2>&1 || true
          docker network rm "$early_network" >/dev/null 2>&1 || true
        }
        fail_early_boot() {
          echo "[FAIL] $1"
          docker logs "$early_app" 2>&1 || true
          docker logs "$early_blackhole" 2>&1 || true
          exit 1
        }
        trap cleanup_early_boot EXIT

        echo "[E2E] Verifying SIGTERM during blocked production bootstrap..."
        docker network create "$early_network" >/dev/null \
          || fail_early_boot "could not create isolated early-boot network"
        docker run -d --name "$early_blackhole" --network "$early_network" alpine:3.22 \
          sh -c 'tail -f /dev/null | nc -l -p 4222' >/dev/null \
          || fail_early_boot "could not start NATS blackhole listener"
        docker run -d --name "$early_app" --network "$early_network" \
          -e "SEMSTREAMS_NATS_URLS=nats://$early_blackhole:4222" \
          -e SEMSTREAMS_LOG_LEVEL=debug \
          c360studio/semstreams:e2e-production \
          --config /app/configs/protocol-flow.json >/dev/null \
          || fail_early_boot "could not start production application"

        attempt=0
        connecting=false
        while [ "$attempt" -lt 50 ]; do
          if docker logs "$early_app" 2>&1 | grep -F '"msg":"Connecting to NATS"' >/dev/null; then
            connecting=true
            break
          fi
          running=$(docker inspect "$early_app" | jq -r '.[0].State.Running') \
            || fail_early_boot "early-boot application state unavailable"
          [ "$running" = "true" ] || fail_early_boot "application exited before entering NATS Connect"
          attempt=$((attempt + 1))
          sleep 0.1
        done
        [ "$connecting" = "true" ] || fail_early_boot "Connecting to NATS evidence absent"

        attempt=0
        accepted=false
        while [ "$attempt" -lt 50 ]; do
          if docker exec "$early_blackhole" netstat -tn 2>/dev/null | grep -q ESTABLISHED; then
            accepted=true
            break
          fi
          attempt=$((attempt + 1))
          sleep 0.1
        done
        [ "$accepted" = "true" ] || fail_early_boot "blackhole did not accept the NATS TCP connection"

        docker kill --signal=TERM "$early_app" >/dev/null \
          || fail_early_boot "could not send SIGTERM to early-boot application"

        attempt=0
        exited=false
        while [ "$attempt" -lt 100 ]; do
          running=$(docker inspect "$early_app" | jq -r '.[0].State.Running') \
            || fail_early_boot "early-boot application state unavailable after SIGTERM"
          if [ "$running" = "false" ]; then
            exited=true
            break
          fi
          attempt=$((attempt + 1))
          sleep 0.1
        done
        [ "$exited" = "true" ] || fail_early_boot "application did not exit within 10s of SIGTERM"

        exit_code=$(docker inspect "$early_app" | jq -er '.[0].State.ExitCode') \
          || fail_early_boot "early-boot exit code unavailable"
        [ "$exit_code" -eq 1 ] \
          || fail_early_boot "early SIGTERM exited $exit_code, want controlled failed-boot exit 1 (not default 143)"

        early_logs=$(docker logs "$early_app" 2>&1)
        printf '%s\n' "$early_logs" | grep -F "context canceled" >/dev/null \
          || fail_early_boot "context-cancellation evidence missing after early SIGTERM"
        if printf '%s\n' "$early_logs" | grep -F "Starting all services" >/dev/null; then
          fail_early_boot "services started after early SIGTERM"
        fi
        echo "[OK] Early SIGTERM canceled blocked NATS boot, exited 1, and fenced service startup"

      # Phase 2 (ADR-103): the graph round-trip probe births a synthetic type
      # (test.fixture.v1) that only cmd/e2e-semstreams registers, so after the
      # production app's shutdown checks it runs against the e2e-target twin.
      - echo "[E2E] Phase 2 - graph round-trip probe against the e2e-target binary..."
      - docker compose -f docker/compose/e2e.yml down -v --timeout 15
      - defer: docker compose -f docker/compose/e2e.yml --profile fixtures down -v --timeout 15
      - docker compose -f docker/compose/e2e.yml --profile fixtures up -d --wait --build nats semstreams-fixtures
      - echo "[OK] e2e-target services are healthy"
      - cd cmd/e2e && ./e2e --scenario core-graph-roundtrip
      - echo "[OK] graph round-trip probe passed against the e2e-target binary"

  debug:
    desc: Start E2E environment for debugging (leaves containers running)
    silent: false
    deps:
      - task: ":e2e:check-ports"
        vars: { COMPOSE_FILES: "docker/compose/e2e.yml" }
    cmds:
      - echo "[E2E DEBUG] Starting SemStreams E2E environment..."
      - docker compose -f docker/compose/e2e.yml up -d --build
      - echo "[E2E DEBUG] Waiting for NATS to be ready..."
      - |
        for i in {1..30}; do
          if curl -sf http://localhost:38222/healthz > /dev/null 2>&1; then
            echo "[OK] NATS is ready"
            break
          fi
          echo "Waiting for NATS... ($i/30)"
          sleep 2
        done
      - echo "[E2E DEBUG] Waiting 5 seconds for SemStreams to start..."
      - sleep 5
      - echo "[E2E DEBUG] Checking SemStreams logs..."
      - docker logs semstreams-e2e-app
      - echo ""
      - echo "[E2E DEBUG] Environment is running. Use the following commands:"
      - echo "  docker logs -f semstreams-e2e-app    (Follow SemStreams logs)"
      - echo "  docker logs -f semstreams-e2e-nats   (Follow NATS logs)"
      - echo "  curl http://localhost:38080/health  (Test health endpoint)"
      - echo "  curl http://localhost:36060/debug/pprof/ (PProf, if SEMSTREAMS_DEBUG=true)"
      - echo "  task e2e:clean                      (Clean up when done)"

  rebuild:
    desc: Force rebuild Docker images from scratch
    deps: [":e2e:clean", ":clean:bins"]
    cmds:
      - echo "[E2E REBUILD] Force rebuilding Docker images with --no-cache..."
      - docker compose -f docker/compose/e2e.yml build --no-cache
      - echo "[OK] Docker images rebuilt from scratch"
      - echo "Tip - Now run task e2e:core to test with fresh images"
