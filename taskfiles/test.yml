version: "3"

tasks:
  default:
    desc: Run all unit tests
    cmds:
      - go test ./...

  race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  integration:
    desc: Run integration tests (uses testcontainers for Docker infra)
    cmds:
      - scripts/run-integration-tests.sh

  integration:iot:
    desc: Run IoT sensor integration tests only
    cmds:
      - scripts/run-integration-tests.sh ./examples/processors/iot_sensor/...

  integration:graph:
    desc: Run graph processor integration tests
    cmds:
      - scripts/run-integration-tests.sh ./processor/graph/...

  live:
    desc: Run all live_llm tests (real providers — needs .env keys / local Ollama)
    cmds:
      - echo "[LIVE] Running all live_llm-tagged tests. Tests skip cleanly when their required key/service is unset."
      - go test -tags=live_llm -v ./...
      - echo "[OK] Live LLM tests complete"

  live:gemini:
    desc: Live round-trip against Gemini 3.x preview (needs GEMINI_API_KEY in .env). Runs single-tool + parallel-tool gates (gh#194 regression coverage).
    cmds:
      - echo "[LIVE] Gemini 3.x thought_signature round-trip (single + parallel tool)..."
      - go test -tags=live_llm -v -timeout 360s -run TestGemini3x_ThoughtSignature ./processor/agentic-model/...

  live:ollama:
    desc: Live response_format integration against local Ollama (needs Ollama at :11434)
    cmds:
      - echo "[LIVE] Ollama response_format integration..."
      - go test -tags=live_llm -v -run TestResponseFormat_Integration ./processor/agentic-model/...
