version: '3'

tasks:
  default:
    desc: Run Go linters (vet, fmt, revive, substrate-flake-guards)
    cmds:
      - go vet ./...
      - go fmt ./...
      # revive: invoked via `go tool` so the pinned version in go.mod
      # is what runs locally too. gh#221 closed Rule 4 of
      # feedback_substrate_flake_discipline.md.
      - go tool revive -config revive.toml -formatter friendly ./...
      - task: test-ports

  test-ports:
    desc: |
      Fail if any *_test.go file binds a fixed TCP port via net.Listen.
      Substrate-flake guard per gh#220 Subclass 2. Regex lives in
      scripts/lint-test-ports.sh — single source of truth shared with
      .github/workflows/ci.yml's inline step (review I4).
    cmds:
      - echo "running fixed-port lint guard (scripts/lint-test-ports.sh)"
      - bash scripts/lint-test-ports.sh

  test-ports:test:
    desc: |
      Verify the fixed-port lint guard catches the expected matrix of
      shapes (positive matches) and exempts the allowed forms (negative
      matches). Runs scripts/lint-test-ports_fixture_test.sh.
    cmds:
      - bash scripts/lint-test-ports_fixture_test.sh

  tool-versions:
    desc: |
      Print versions of pinned developer tools (currently: revive).
      Versions are pinned via go.mod's `tool` directive (Go 1.24+);
      `task lint` invokes them via `go tool`, so there's no separate
      install step. Run this to sanity-check the pinned version matches
      what's running locally.

      Must be run from inside the module root (anywhere under the
      semstreams repo). `go tool <pkg>` requires module context to
      resolve the version.

      gh#221 closed Rule 4 of feedback_substrate_flake_discipline.md —
      no more local-vs-CI revive version drift surprising you with new
      warnings.
    cmds:
      - echo "pinned tool versions (from go.mod 'tool' directive):"
      - go tool revive --version
